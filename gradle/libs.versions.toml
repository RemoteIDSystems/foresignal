# Foresignal version catalog.
# Every version below was verified to exist on Maven Central (via
# repo1.maven.org maven-metadata.xml) and to be compatible with
# Spring Boot 4.1 and Java 21.
[versions]
springBoot = "4.1.1"
springDependencyManagement = "1.1.7"
bucket4j = "8.21.0"
springdoc = "3.1.1"
testcontainers = "2.0.5"
wiremock = "3.13.2"
awaitility = "4.3.0"
greenmail = "2.1.14"
# JSON Schema 2020-12 validator: the event-schema and Postman contract tests (020), and at runtime
# the EDP manifest payload schemas and items (024). 3.x is built on Jackson 3 (tools.jackson),
# matching Spring Boot 4; Apache-2.0. Runtime dependencies: com.ethlo.time:itu (Apache-2.0) and
# jackson-dataformat-yaml (Apache-2.0); joni and GraalJS are optional and not used.
jsonSchemaValidator = "3.0.8"
# Linear-time regular expressions for EDP payload-schema patterns (024, EDP §7): RE2/J 1.8, the Go
# license (BSD-3-Clause), no runtime dependencies.
re2j = "1.8"
jacoco = "0.8.15"
# QR codes of pairing payloads (023): ZXing core 3.5.4, Apache-2.0, no runtime dependencies.
zxing = "3.5.4"
# MCP server (025): the official MCP Java SDK, core plus its Jackson 3 JSON binding (matching Spring
# Boot 4), MIT. Verified on Maven Central 2026-10-12: 2.0.1 is the latest release of
# io.modelcontextprotocol.sdk:mcp-core and mcp-json-jackson3. The SDK no longer ships Spring
# transports (they moved to Spring AI 2.x, which is not used); its servlet transports are registered
# directly. Runtime dependencies: reactor-core and slf4j-api (versions from the Spring Boot BOM),
# jackson-annotations, and json-schema-validator (already 3.0.8 here).
mcp = "2.0.1"
# LLM provider type `anthropic` (026): the official Anthropic Java SDK with its OkHttp client, MIT.
# Verified on Maven Central 2026-10-12: 2.71.0 is the latest release of com.anthropic:anthropic-java.
# It is built on Jackson 2 (com.fasterxml.jackson, versions from the Spring Boot BOM), Kotlin stdlib
# and OkHttp (Apache-2.0). Only provider type `anthropic` uses it; the OpenAI-compatible and Ollama
# clients use java.net.http.
anthropic = "2.71.0"
# WebP tiles and images (108): webp-imageio 0.10.0, Apache-2.0 (libwebp BSD-3). Verified on Maven
# Central 2026-10-15 (0.11.0 from the design is not published there).
webpImageio = "0.10.0"
# MBTiles exports (108): sqlite-jdbc 3.53.4.0, Apache-2.0. Verified on Maven Central 2026-10-15.
sqliteJdbc = "3.53.4.0"
# Briefing HTML renditions (029): CommonMark with GFM tables, BSD-2-Clause, no runtime dependencies.
# Verified on Maven Central 2026-10-12: 0.30.1 is the latest release of org.commonmark:commonmark and
# commonmark-ext-gfm-tables (Java 11 bytecode). Raw HTML in the markdown is escaped, not passed through.
commonmark = "0.30.1"
# The allowlist sanitizer applied to every briefing HTML rendition (029): OWASP Java HTML Sanitizer,
# Apache-2.0 or BSD-2-Clause (dual), no runtime dependencies (spotbugs annotations are provided-scope).
# Verified on Maven Central 2026-10-12: 20261011.1 is the latest release.
owaspHtmlSanitizer = "20261011.1"
# H3 cells of activity rollups and stats grids (038): Uber's H3 Java binding, Apache-2.0, no runtime
# dependencies. Verified on Maven Central 2026-10-12: 4.5.0 is the latest release of com.uber:h3; the jar
# bundles the JNI library for linux-x64, linux-arm64, darwin-x64 and darwin-arm64 (and others), extracted
# to java.io.tmpdir on first use.
h3 = "4.5.0"
# Bzip2 decompression of the RIPE Atlas probe dump (092): Apache Commons Compress, Apache-2.0.
commonsCompress = "1.27.1"
# Discovery statistics (119, Intelligence-Design §12): Apache Commons Statistics (distributions, inference),
# Commons Numbers (regularized gamma and beta) and Commons RNG (deterministic seeded sampling), all Apache-2.0.
# Verified on Maven Central 2026-10-17: commons-statistics-distribution and -inference 1.3 (released 2026-05),
# commons-numbers-gamma 1.3 (2026-04; the version Statistics 1.3 is built against), commons-rng-simple and
# -sampling 1.7 (2026-04; Statistics 1.3 is built against 1.6, a compatible minor release). Java 8 bytecode.
commonsStatistics = "1.3"
commonsNumbers = "1.3"
commonsRng = "1.7"
# Series forecasts, outlooks and index fits (126, Intelligence-Design §12): Hipparchus optimizers (BOBYQA for the ETS
# maximum likelihood). Verified on Maven Central 2026-10-17: org.hipparchus:hipparchus-optim 4.0.3 is the latest
# release (maven-metadata.xml), Apache License 2.0 (the POM's <licenses> and the project LICENSE.txt), Java 8
# bytecode. It is the version Orekit 13.1.9 already brings, so the runtime classpath does not change.
hipparchus = "4.0.3"
# GRIB2 and NetCDF4/HDF5 decoding (046, Weather-Imagery-Design §0.1 and §3): NetCDF-Java, BSD-3-Clause.
# NOT on Maven Central: resolved only from https://artifacts.unidata.ucar.edu/all/ under Gradle
# exclusiveContent (build.gradle.kts), the one explicit exception to the Maven-Central rule
# (Architecture §2 and §26). Verified there 2026-10-12: netcdf-java-bom, cdm-core and grib 5.11.0.
# Modules used: cdm-core and grib (no netcdf4 module, which needs the native netCDF-C library), plus
# cdm-radial for its NIDS (NEXRAD Level III) IOSP (106; verified there 2026-10-16: cdm-radial 5.11.0, BSD-3,
# listed in the 5.11.0 BOM, decodes products 153/154 to BaseReflectivityDR/BaseVelocityDV).
netcdfJava = "5.11.0"
# CCSDS/AEC (GRIB2 template 5.42) native library for NetCDF-Java's libaec-jna, BSD-2-Clause; verified
# in the same repository 2026-10-12 (edu.ucar.unidata:libaec-native:1.1.7.0, also the BOM's version).
libaec = "1.1.7.0"
# SGP4 for the SatDump approximate swath (054) and, later, predicted passes (064): Orekit, Apache-2.0.
# Verified on Maven Central 2026-10-13: 13.1.9 is the latest 13.1.x release of org.orekit:orekit
# (Java 8 bytecode; runtime dependencies Hipparchus 4.0.3 core, geometry, ode, fitting, optim, filtering and
# stat, all Apache-2.0). Its data (leap seconds and one EOP file) is a pinned subset under
# src/main/resources/orekit-data/.
orekit = "13.1.9"
# RecordMapping JSONPath (059): Jayway JsonPath, Apache-2.0. Verified on Maven Central 2026-10-13: 3.0.0 is
# the latest release of com.jayway.jsonpath:json-path, the first line with Jackson 3 providers
# (Jackson3JsonNodeJsonProvider, Jackson3MappingProvider). Its json-smart runtime dependency is excluded
# from the application (build.gradle.kts): the mapping code always passes its own Jackson 3 configuration.
# The Spring Boot BOM manages json-path at 2.10.0; build.gradle.kts overrides the BOM property.
jsonPath = "3.0.0"
# MQTT channel and Home Assistant discovery (060), reused by the MQTT source adapters (083, 085): HiveMQ MQTT
# Client, Apache-2.0, MQTT 3.1.1 and 5, async API, WebSocket transport. Verified on Maven Central 2026-10-13:
# 1.4.0 (2026-08-21) is the latest release of com.hivemq:hivemq-mqtt-client and -shaded. Chosen over Eclipse
# Paho (org.eclipse.paho.mqttv5.client, last release 1.2.5 in July 2020, treated as unmaintained).
# The SHADED artifact is used: the plain one declares Netty 4.1.137.Final, and the Spring Boot 4.1.1 BOM
# resolves it to 4.2.17.Final (`./gradlew dependencyInsight --dependency netty-handler`), a major-line clash.
# The shaded jar relocates its own Netty 4.1.137 (with the WebSocket codec and SSL handler), JCTools, Dagger
# and javax.inject under com.hivemq.client.internal.shaded; it still depends on RxJava 2.2.21, Reactive Streams
# 1.0.4 and org.jetbrains:annotations.
hivemqMqttClient = "1.4.0"
# The permessage-deflate WebSocket client of SourceHttp.openWebSocket(..., WebSocketOptions) (063): TooTallNate
# Java-WebSocket, MIT. Verified on Maven Central 2026-10-13: 1.6.0 is the latest release of
# org.java-websocket:Java-WebSocket (Java 7 bytecode, class version 51); its only runtime dependency is slf4j-api (version from the
# Spring Boot BOM). The JDK's java.net.http.WebSocket cannot negotiate extensions, and aisstream.io limits the
# bandwidth of uncompressed connections since September 2026. Its WebSocketServer is also the loopback test
# server of the aisstream tests.
javaWebsocket = "1.6.0"
# GTFS-Realtime bindings of the transit-* sources (070): MobilityData's org.mobilitydata:gtfs-realtime-bindings,
# Apache-2.0. Verified on Maven Central 2026-10-13: 0.2.0 (2026-07-29) is the latest release; its classes are
# com.google.transit.realtime.GtfsRealtime, generated from a proto that already has Alert communication_period,
# impact_period, cause_detail, effect_detail, image and Cause SPECIAL_EVENT. Its only runtime dependency is
# com.google.protobuf:protobuf-java 4.34.0 (BSD-3-Clause). protobuf-java is pinned to 4.36.1 (verified on Maven Central
# 2026-10-13), the version NetCDF-Java cdm-core 5.11.0 declares: the Spring Boot 4.1.1 BOM would otherwise resolve
# 4.35.1, older than cdm-core's, and protobuf accepts a runtime newer than the 4.34.0 the bindings were generated
# with within major 4. build.gradle.kts overrides the BOM property. The old com.google.transit:gtfs-realtime-bindings
# stopped at 0.0.4 and is not used.
gtfsRealtimeBindings = "0.2.0"
protobufJava = "4.36.1"
# HTML to plain text for feed-kit item summaries (073): jsoup, MIT. Verified on Maven Central 2026-10-13: 1.23.2 is
# the latest release (Java 8 bytecode); no required runtime dependencies (re2j is optional and already present).
jsoup = "1.23.2"
# Attachment text extraction (130): Apache PDFBox, Apache-2.0. Verified on Maven Central 2026-10-17: 3.0.8 is the
# latest release (maven-metadata.xml latest/release 3.0.8, published 2026-07-08); Java 8 bytecode, depends on
# pdfbox-io, fontbox and commons-logging (bcprov and bcpkix are optional).
pdfbox = "3.0.8"

# Bulk exports (111): parquet-java 1.18.1 (Apache-2.0) for GeoParquet 1.1; the Hadoop server stack is
# excluded below. Verified on Maven Central 2026-10-15.
parquetVersion = "1.18.1"
# FlatGeobuf (111): org.wololo:flatgeobuf 3.29.0 (ISC license, per its POM); with JTS. Verified on Maven Central
# 2026-10-16 (latest release 3.29.0).
flatgeobufVersion = "3.29.0"
# Compile-only and test-only (111): hadoop-common 3.4.1, non-transitive. parquet-hadoop's ParquetFileWriter and
# ParquetFileReader have overloads naming org.apache.hadoop.conf.Configuration, so javac needs the class; nothing of
# Hadoop is on the runtime classpath. Verified on Maven Central 2026-10-16.
hadoopCommon = "3.4.1"
# zstd-jni (111): ZSTD compression of GeoParquet pages (BSD-2-Clause). 1.5.7-15 is the version parquet-hadoop
# 1.18.1 depends on; verified on Maven Central 2026-10-16 (latest there 1.5.7-23).
zstdJni = "1.5.7-15"
# Social post language detection (135): Lingua, Apache-2.0. Verified on Maven Central 2026-10-17: 1.2.2 is the latest
# release (maven-metadata.xml latest/release 1.2.2, last updated 2022-08-02); runtime deps kotlin-stdlib 1.6.21 (the
# Spring Boot BOM manages kotlin-stdlib, already on the classpath through anthropic-java), moshi 1.13.0 and fastutil
# 8.5.8, all Apache-2.0. The jar is about 80 MB because it carries every language model; only the languages in
# social.languages are loaded.
lingua = "1.2.2"

# MCP remote authorization (141): Nimbus JOSE+JWT verifies the identity provider's access tokens (RS256, ES256,
# EdDSA/Ed25519) against its JWKS, Apache-2.0. Verified on Maven Central 2026-10-18: 10.10 is the latest release of
# com.nimbusds:nimbus-jose-jwt (maven-metadata.xml latest/release 10.10, published 2026-09-17); Java 8 bytecode, gson
# and jcip shaded inside, no required runtime dependencies (Tink and Bouncy Castle are optional).
nimbusJoseJwt = "10.10"
# Nimbus's Ed25519Verifier is built on Google Tink (com.google.crypto.tink.subtle.Ed25519Verify), an optional dependency
# of Nimbus that must be added for EdDSA/Ed25519 tokens, Apache-2.0. 1.23.0 is the version nimbus-jose-jwt 10.10
# declares (verified on Maven Central 2026-10-18, published 2026-07-09); 1.24.0 is two days old and not used. Like
# Nimbus, build.gradle.kts excludes protobuf-java from it (the Ed25519 primitives do not use it, and protobuf-java
# stays pinned above); remaining runtime dependencies: gson, jsr305 and error_prone_annotations.
tink = "1.23.0"

[libraries]
# --- Versions managed by the Spring Boot BOM ---
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }
# MockMvc's auto-configuration. In Boot 4 the web test slice moved out of
# spring-boot-test-autoconfigure into this module, and spring-boot-starter-test
# does not pull it in.
spring-boot-webmvc-test = { module = "org.springframework.boot:spring-boot-webmvc-test" }
hibernate-spatial = { module = "org.hibernate.orm:hibernate-spatial" }
# GeoJSON is read by Foresignal's own Jackson 3 reader
# (ai.foresignal.source.formats.geojson.GeoJsonReader). jts-io-common was removed
# in prompt 008 because it pulls in the unmaintained json-simple 1.1.1.
# jts-core arrives through hibernate-spatial.
postgresql = { module = "org.postgresql:postgresql" }
micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus" }
# The raster frame cache (042) and, from 045, the tile and index-map caches: Caffeine with byte
# weighers, Apache-2.0. Version from the Spring Boot 4.1.1 BOM (caffeine.version 3.2.4, verified on
# Maven Central 2026-10-12); its runtime dependencies are org.jspecify:jspecify (Apache-2.0) and
# com.google.errorprone:error_prone_annotations (Apache-2.0).
caffeine = { module = "com.github.ben-manes.caffeine:caffeine" }
# CSV output for the streaming formats (014); Jackson 3, version from the Jackson BOM that
# Spring Boot imports (3.1.5 with Boot 4.1.1), Apache-2.0.
jackson-dataformat-csv = { module = "tools.jackson.dataformat:jackson-dataformat-csv" }
# SatDump product.cbor (049, Weather-Imagery-Design §3); Jackson 3, version from the Jackson BOM that
# Spring Boot imports, Apache-2.0.
jackson-dataformat-cbor = { module = "tools.jackson.dataformat:jackson-dataformat-cbor" }

# Notification channel type `email` (018): JavaMailSender over Jakarta Mail; versions from the
# Spring Boot BOM (angus-mail 2.0.5, EPL-2.0 / EDL-1.0 / GPL-2.0 with Classpath Exception).
spring-boot-starter-mail = { module = "org.springframework.boot:spring-boot-starter-mail" }

# Trace ids in logs (019): Micrometer Tracing over the OpenTelemetry bridge, with no exporter on the
# classpath, so nothing is exported. Versions from the Spring Boot 4.1.1 BOM (micrometer-tracing
# 1.7.1, opentelemetry 1.62.0), all Apache-2.0.
spring-boot-micrometer-tracing-opentelemetry = { module = "org.springframework.boot:spring-boot-micrometer-tracing-opentelemetry" }
micrometer-tracing-bridge-otel = { module = "io.micrometer:micrometer-tracing-bridge-otel" }

# --- Explicitly versioned ---
bucket4j-core = { module = "com.bucket4j:bucket4j_jdk17-core", version.ref = "bucket4j" }
springdoc-openapi-starter-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
# SVG QR codes for device pairing (023); the decoder used by PairingIT is in the same artifact.
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
# EDP payload-schema patterns run on RE2/J through the validator's regular-expression hook (024).
re2j = { module = "com.google.re2j:re2j", version.ref = "re2j" }
# The MCP server at /mcp (025): streamable HTTP and the optional legacy HTTP+SSE servlet transports.
mcp-core = { module = "io.modelcontextprotocol.sdk:mcp-core", version.ref = "mcp" }
mcp-json-jackson3 = { module = "io.modelcontextprotocol.sdk:mcp-json-jackson3", version.ref = "mcp" }
nimbus-jose-jwt = { module = "com.nimbusds:nimbus-jose-jwt", version.ref = "nimbusJoseJwt" }
tink = { module = "com.google.crypto.tink:tink", version.ref = "tink" }
# LLM provider type `anthropic` (026): messages, streaming, models; pointed at WireMock in tests.
anthropic-java = { module = "com.anthropic:anthropic-java", version.ref = "anthropic" }
# Briefing HTML renditions (029): markdown to HTML, then allowlist sanitizing.
commonmark = { module = "org.commonmark:commonmark", version.ref = "commonmark" }
commonmark-ext-gfm-tables = { module = "org.commonmark:commonmark-ext-gfm-tables", version.ref = "commonmark" }
owasp-java-html-sanitizer = { module = "com.googlecode.owasp-java-html-sanitizer:owasp-java-html-sanitizer", version.ref = "owaspHtmlSanitizer" }
# Activity rollups and stats grids (038): lat/lng to H3 cell, parents and cell boundaries.
h3 = { module = "com.uber:h3", version.ref = "h3" }
# RIPE Atlas probe dump decompression (092).
commons-compress = { module = "org.apache.commons:commons-compress", version.ref = "commonsCompress" }
# Discovery statistics (119): distributions, inference, regularized beta/gamma, seeded random sources.
commons-statistics-distribution = { module = "org.apache.commons:commons-statistics-distribution", version.ref = "commonsStatistics" }
commons-statistics-inference = { module = "org.apache.commons:commons-statistics-inference", version.ref = "commonsStatistics" }
commons-numbers-gamma = { module = "org.apache.commons:commons-numbers-gamma", version.ref = "commonsNumbers" }
commons-rng-simple = { module = "org.apache.commons:commons-rng-simple", version.ref = "commonsRng" }
commons-rng-sampling = { module = "org.apache.commons:commons-rng-sampling", version.ref = "commonsRng" }
# Series forecasts and outlooks (126): bounded optimizers for the ETS maximum likelihood.
hipparchus-optim = { module = "org.hipparchus:hipparchus-optim", version.ref = "hipparchus" }
# GRIB2 and NetCDF4 decoders (046); from the Unidata repository only (see the versions block).
netcdf-java-bom = { module = "edu.ucar:netcdf-java-bom", version.ref = "netcdfJava" }
netcdf-cdm-core = { module = "edu.ucar:cdm-core" }
netcdf-grib = { module = "edu.ucar:grib" }
netcdf-cdm-radial = { module = "edu.ucar:cdm-radial" }
libaec-native = { module = "edu.ucar.unidata:libaec-native", version.ref = "libaec" }
# SGP4 swaths of SatDump passes (054); 064 reuses it for predicted passes.
orekit = { module = "org.orekit:orekit", version.ref = "orekit" }
json-path = { module = "com.jayway.jsonpath:json-path", version.ref = "jsonPath" }
hivemq-mqtt-client-shaded = { module = "com.hivemq:hivemq-mqtt-client-shaded", version.ref = "hivemqMqttClient" }
java-websocket = { module = "org.java-websocket:Java-WebSocket", version.ref = "javaWebsocket" }
gtfs-realtime-bindings = { module = "org.mobilitydata:gtfs-realtime-bindings", version.ref = "gtfsRealtimeBindings" }
protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protobufJava" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
pdfbox = { module = "org.apache.pdfbox:pdfbox", version.ref = "pdfbox" }
# GeoParquet 1.1 exports (111): parquet-column + parquet-hadoop; Hadoop server stack excluded in build.gradle.kts.
parquet-column = { module = "org.apache.parquet:parquet-column", version.ref = "parquetVersion" }
parquet-hadoop = { module = "org.apache.parquet:parquet-hadoop", version.ref = "parquetVersion" }
# Compile-only/test-only: org.apache.hadoop.conf.Configuration for javac's overload resolution; non-transitive so no
# Hadoop server stack (hdfs/yarn/mapreduce/jetty) enters the runtime classpath.
hadoop-common = { module = "org.apache.hadoop:hadoop-common", version.ref = "hadoopCommon" }
# FlatGeobuf exports (111).
flatgeobuf = { module = "org.wololo:flatgeobuf", version.ref = "flatgeobufVersion" }
zstd-jni = { module = "com.github.luben:zstd-jni", version.ref = "zstdJni" }
# WebP tiles and images (108): webp-imageio, Apache-2.0, bundles libwebp (BSD-3) natives for
# linux-x86_64/aarch64 and macOS/Windows. The design cites 0.11.0; 0.10.0 is the latest on Central
# (verified 2026-10-15).
webp-imageio = { module = "com.github.usefulness:webp-imageio", version.ref = "webpImageio" }
# MBTiles exports (108): sqlite-jdbc, Apache-2.0, bundles the SQLite native library.
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqliteJdbc" }
# Social post language detection (135), Apache-2.0.
lingua = { module = "com.github.pemistahl:lingua", version.ref = "lingua" }

# --- Test; versions from the Testcontainers BOM where unspecified ---
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }
testcontainers-junit-jupiter = { module = "org.testcontainers:testcontainers-junit-jupiter" }
# Cuts the MQTT connection under the client to prove the Last Will (060); MIT (toxiproxy-java 2.1.11, Apache-2.0).
testcontainers-toxiproxy = { module = "org.testcontainers:testcontainers-toxiproxy" }
wiremock-standalone = { module = "org.wiremock:wiremock-standalone", version.ref = "wiremock" }
awaitility = { module = "org.awaitility:awaitility", version.ref = "awaitility" }
# In-process SMTP server for the email channel tests (018), Apache-2.0.
greenmail = { module = "com.icegreen:greenmail", version.ref = "greenmail" }
# Validates serialized DTOs and Postman bodies against docs/OpenAPI.json schemas (020) and, at runtime,
# EDP manifests and items (024), Apache-2.0.
json-schema-validator = { module = "com.networknt:json-schema-validator", version.ref = "jsonSchemaValidator" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
