# Foresignal version catalog.
# Every version below was verified to exist on Maven Central (via
# repo1.maven.org maven-metadata.xml) and to be compatible with
# Spring Boot 4.1 and Java 21.
[versions]
springBoot = "4.1.1"
springDependencyManagement = "1.1.7"
bucket4j = "8.21.0"
springdoc = "3.1.1"
testcontainers = "2.0.5"
wiremock = "3.13.2"
awaitility = "4.3.0"
greenmail = "2.1.14"
jacoco = "0.8.15"

[libraries]
# --- Versions managed by the Spring Boot BOM ---
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }
# MockMvc's auto-configuration. In Boot 4 the web test slice moved out of
# spring-boot-test-autoconfigure into this module, and spring-boot-starter-test
# does not pull it in.
spring-boot-webmvc-test = { module = "org.springframework.boot:spring-boot-webmvc-test" }
hibernate-spatial = { module = "org.hibernate.orm:hibernate-spatial" }
# GeoJSON is read by Foresignal's own Jackson 3 reader
# (ai.foresignal.source.formats.geojson.GeoJsonReader). jts-io-common was removed
# in prompt 008 because it pulls in the unmaintained json-simple 1.1.1.
# jts-core arrives through hibernate-spatial.
postgresql = { module = "org.postgresql:postgresql" }
micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus" }
# CSV output for the streaming formats (014); Jackson 3, version from the Jackson BOM that
# Spring Boot imports (3.1.5 with Boot 4.1.1), Apache-2.0.
jackson-dataformat-csv = { module = "tools.jackson.dataformat:jackson-dataformat-csv" }

# Notification channel type `email` (018): JavaMailSender over Jakarta Mail; versions from the
# Spring Boot BOM (angus-mail 2.0.5, EPL-2.0 / EDL-1.0 / GPL-2.0 with Classpath Exception).
spring-boot-starter-mail = { module = "org.springframework.boot:spring-boot-starter-mail" }

# Trace ids in logs (019): Micrometer Tracing over the OpenTelemetry bridge, with no exporter on the
# classpath, so nothing is exported. Versions from the Spring Boot 4.1.1 BOM (micrometer-tracing
# 1.7.1, opentelemetry 1.62.0), all Apache-2.0.
spring-boot-micrometer-tracing-opentelemetry = { module = "org.springframework.boot:spring-boot-micrometer-tracing-opentelemetry" }
micrometer-tracing-bridge-otel = { module = "io.micrometer:micrometer-tracing-bridge-otel" }

# --- Explicitly versioned ---
bucket4j-core = { module = "com.bucket4j:bucket4j_jdk17-core", version.ref = "bucket4j" }
springdoc-openapi-starter-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }

# --- Test; versions from the Testcontainers BOM where unspecified ---
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }
testcontainers-junit-jupiter = { module = "org.testcontainers:testcontainers-junit-jupiter" }
wiremock-standalone = { module = "org.wiremock:wiremock-standalone", version.ref = "wiremock" }
awaitility = { module = "org.awaitility:awaitility", version.ref = "awaitility" }
# In-process SMTP server for the email channel tests (018), Apache-2.0.
greenmail = { module = "com.icegreen:greenmail", version.ref = "greenmail" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
