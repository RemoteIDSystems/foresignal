# Foresignal version catalog.
# Every version below was verified to exist on Maven Central (via
# repo1.maven.org maven-metadata.xml) and to be compatible with
# Spring Boot 4.1 and Java 21.
[versions]
springBoot = "4.1.1"
springDependencyManagement = "1.1.7"
bucket4j = "8.21.0"
springdoc = "3.1.1"
testcontainers = "2.0.5"
wiremock = "3.13.2"
awaitility = "4.3.0"
greenmail = "2.1.14"
# JSON Schema 2020-12 validator: the event-schema and Postman contract tests (020), and at runtime
# the EDP manifest payload schemas and items (024). 3.x is built on Jackson 3 (tools.jackson),
# matching Spring Boot 4; Apache-2.0. Runtime dependencies: com.ethlo.time:itu (Apache-2.0) and
# jackson-dataformat-yaml (Apache-2.0); joni and GraalJS are optional and not used.
jsonSchemaValidator = "3.0.8"
# Linear-time regular expressions for EDP payload-schema patterns (024, EDP §7): RE2/J 1.8, the Go
# license (BSD-3-Clause), no runtime dependencies.
re2j = "1.8"
jacoco = "0.8.15"
# QR codes of pairing payloads (023): ZXing core 3.5.4, Apache-2.0, no runtime dependencies.
zxing = "3.5.4"
# MCP server (025): the official MCP Java SDK, core plus its Jackson 3 JSON binding (matching Spring
# Boot 4), MIT. Verified on Maven Central 2026-10-12: 2.0.1 is the latest release of
# io.modelcontextprotocol.sdk:mcp-core and mcp-json-jackson3. The SDK no longer ships Spring
# transports (they moved to Spring AI 2.x, which is not used); its servlet transports are registered
# directly. Runtime dependencies: reactor-core and slf4j-api (versions from the Spring Boot BOM),
# jackson-annotations, and json-schema-validator (already 3.0.8 here).
mcp = "2.0.1"
# LLM provider type `anthropic` (026): the official Anthropic Java SDK with its OkHttp client, MIT.
# Verified on Maven Central 2026-10-12: 2.71.0 is the latest release of com.anthropic:anthropic-java.
# It is built on Jackson 2 (com.fasterxml.jackson, versions from the Spring Boot BOM), Kotlin stdlib
# and OkHttp (Apache-2.0). Only provider type `anthropic` uses it; the OpenAI-compatible and Ollama
# clients use java.net.http.
anthropic = "2.71.0"
# Briefing HTML renditions (029): CommonMark with GFM tables, BSD-2-Clause, no runtime dependencies.
# Verified on Maven Central 2026-10-12: 0.30.1 is the latest release of org.commonmark:commonmark and
# commonmark-ext-gfm-tables (Java 11 bytecode). Raw HTML in the markdown is escaped, not passed through.
commonmark = "0.30.1"
# The allowlist sanitizer applied to every briefing HTML rendition (029): OWASP Java HTML Sanitizer,
# Apache-2.0 or BSD-2-Clause (dual), no runtime dependencies (spotbugs annotations are provided-scope).
# Verified on Maven Central 2026-10-12: 20261011.1 is the latest release.
owaspHtmlSanitizer = "20261011.1"
# H3 cells of activity rollups and stats grids (038): Uber's H3 Java binding, Apache-2.0, no runtime
# dependencies. Verified on Maven Central 2026-10-12: 4.5.0 is the latest release of com.uber:h3; the jar
# bundles the JNI library for linux-x64, linux-arm64, darwin-x64 and darwin-arm64 (and others), extracted
# to java.io.tmpdir on first use.
h3 = "4.5.0"
# GRIB2 and NetCDF4/HDF5 decoding (046, Weather-Imagery-Design §0.1 and §3): NetCDF-Java, BSD-3-Clause.
# NOT on Maven Central: resolved only from https://artifacts.unidata.ucar.edu/all/ under Gradle
# exclusiveContent (build.gradle.kts), the one explicit exception to the Maven-Central rule
# (Architecture §2 and §26). Verified there 2026-10-12: netcdf-java-bom, cdm-core and grib 5.11.0.
# Modules used: cdm-core and grib only (no netcdf4 module, which needs the native netCDF-C library).
netcdfJava = "5.11.0"
# CCSDS/AEC (GRIB2 template 5.42) native library for NetCDF-Java's libaec-jna, BSD-2-Clause; verified
# in the same repository 2026-10-12 (edu.ucar.unidata:libaec-native:1.1.7.0, also the BOM's version).
libaec = "1.1.7.0"

[libraries]
# --- Versions managed by the Spring Boot BOM ---
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }
# MockMvc's auto-configuration. In Boot 4 the web test slice moved out of
# spring-boot-test-autoconfigure into this module, and spring-boot-starter-test
# does not pull it in.
spring-boot-webmvc-test = { module = "org.springframework.boot:spring-boot-webmvc-test" }
hibernate-spatial = { module = "org.hibernate.orm:hibernate-spatial" }
# GeoJSON is read by Foresignal's own Jackson 3 reader
# (ai.foresignal.source.formats.geojson.GeoJsonReader). jts-io-common was removed
# in prompt 008 because it pulls in the unmaintained json-simple 1.1.1.
# jts-core arrives through hibernate-spatial.
postgresql = { module = "org.postgresql:postgresql" }
micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus" }
# The raster frame cache (042) and, from 045, the tile and index-map caches: Caffeine with byte
# weighers, Apache-2.0. Version from the Spring Boot 4.1.1 BOM (caffeine.version 3.2.4, verified on
# Maven Central 2026-10-12); its runtime dependencies are org.jspecify:jspecify (Apache-2.0) and
# com.google.errorprone:error_prone_annotations (Apache-2.0).
caffeine = { module = "com.github.ben-manes.caffeine:caffeine" }
# CSV output for the streaming formats (014); Jackson 3, version from the Jackson BOM that
# Spring Boot imports (3.1.5 with Boot 4.1.1), Apache-2.0.
jackson-dataformat-csv = { module = "tools.jackson.dataformat:jackson-dataformat-csv" }
# SatDump product.cbor (049, Weather-Imagery-Design §3); Jackson 3, version from the Jackson BOM that
# Spring Boot imports, Apache-2.0.
jackson-dataformat-cbor = { module = "tools.jackson.dataformat:jackson-dataformat-cbor" }

# Notification channel type `email` (018): JavaMailSender over Jakarta Mail; versions from the
# Spring Boot BOM (angus-mail 2.0.5, EPL-2.0 / EDL-1.0 / GPL-2.0 with Classpath Exception).
spring-boot-starter-mail = { module = "org.springframework.boot:spring-boot-starter-mail" }

# Trace ids in logs (019): Micrometer Tracing over the OpenTelemetry bridge, with no exporter on the
# classpath, so nothing is exported. Versions from the Spring Boot 4.1.1 BOM (micrometer-tracing
# 1.7.1, opentelemetry 1.62.0), all Apache-2.0.
spring-boot-micrometer-tracing-opentelemetry = { module = "org.springframework.boot:spring-boot-micrometer-tracing-opentelemetry" }
micrometer-tracing-bridge-otel = { module = "io.micrometer:micrometer-tracing-bridge-otel" }

# --- Explicitly versioned ---
bucket4j-core = { module = "com.bucket4j:bucket4j_jdk17-core", version.ref = "bucket4j" }
springdoc-openapi-starter-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
# SVG QR codes for device pairing (023); the decoder used by PairingIT is in the same artifact.
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
# EDP payload-schema patterns run on RE2/J through the validator's regular-expression hook (024).
re2j = { module = "com.google.re2j:re2j", version.ref = "re2j" }
# The MCP server at /mcp (025): streamable HTTP and the optional legacy HTTP+SSE servlet transports.
mcp-core = { module = "io.modelcontextprotocol.sdk:mcp-core", version.ref = "mcp" }
mcp-json-jackson3 = { module = "io.modelcontextprotocol.sdk:mcp-json-jackson3", version.ref = "mcp" }
# LLM provider type `anthropic` (026): messages, streaming, models; pointed at WireMock in tests.
anthropic-java = { module = "com.anthropic:anthropic-java", version.ref = "anthropic" }
# Briefing HTML renditions (029): markdown to HTML, then allowlist sanitizing.
commonmark = { module = "org.commonmark:commonmark", version.ref = "commonmark" }
commonmark-ext-gfm-tables = { module = "org.commonmark:commonmark-ext-gfm-tables", version.ref = "commonmark" }
owasp-java-html-sanitizer = { module = "com.googlecode.owasp-java-html-sanitizer:owasp-java-html-sanitizer", version.ref = "owaspHtmlSanitizer" }
# Activity rollups and stats grids (038): lat/lng to H3 cell, parents and cell boundaries.
h3 = { module = "com.uber:h3", version.ref = "h3" }
# GRIB2 and NetCDF4 decoders (046); from the Unidata repository only (see the versions block).
netcdf-java-bom = { module = "edu.ucar:netcdf-java-bom", version.ref = "netcdfJava" }
netcdf-cdm-core = { module = "edu.ucar:cdm-core" }
netcdf-grib = { module = "edu.ucar:grib" }
libaec-native = { module = "edu.ucar.unidata:libaec-native", version.ref = "libaec" }

# --- Test; versions from the Testcontainers BOM where unspecified ---
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }
testcontainers-junit-jupiter = { module = "org.testcontainers:testcontainers-junit-jupiter" }
wiremock-standalone = { module = "org.wiremock:wiremock-standalone", version.ref = "wiremock" }
awaitility = { module = "org.awaitility:awaitility", version.ref = "awaitility" }
# In-process SMTP server for the email channel tests (018), Apache-2.0.
greenmail = { module = "com.icegreen:greenmail", version.ref = "greenmail" }
# Validates serialized DTOs and Postman bodies against docs/OpenAPI.json schemas (020) and, at runtime,
# EDP manifests and items (024), Apache-2.0.
json-schema-validator = { module = "com.networknt:json-schema-validator", version.ref = "jsonSchemaValidator" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
