# Prometheus scrape configuration for the Grafana override (docs/cookbooks/grafana.md).
# /actuator/prometheus is unauthenticated: scrape it over the compose network only.
global:
  scrape_interval: 30s

scrape_configs:
  - job_name: foresignal
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [ "foresignal:8080" ]
