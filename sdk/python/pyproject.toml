# Foresignal Python SDK (prompt 141): the generated client package `foresignal_client`
# (openapi-python-client, regenerated by `./gradlew generateSdks`) and the hand-written `foresignal_sdk`
# package (realtime, paging and client-contract helpers on httpx). Versions: sdk/versions.properties.
# The version is the API's info.version; publishing is a separate release step.
[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "foresignal-client"
version = "1.5.0"
description = "Python SDK for the Foresignal API: generated client plus realtime, paging and client-contract helpers"
readme = "README.md"
license = "MIT"
classifiers = ["Private :: Do Not Upload"]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1,<0.29",
    "attrs>=26.1.0",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
include = ["foresignal_client*", "foresignal_sdk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
