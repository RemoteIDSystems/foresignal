# Pinned tool and runtime versions for the generated Foresignal SDKs (prompt 141).
#
# Read by gradle/sdk.gradle.kts (generateSdks, checkSdkGeneration) and mirrored in the SDK manifests
# (sdk/dart/*/pubspec.yaml, sdk/typescript/package.json, sdk/python/pyproject.toml). Every version was
# checked against its registry on 2026-10-18 and is at least two weeks old on that date, except where a
# comment says otherwise. Change a version here and in the manifest together, then regenerate.

# --- Generators -------------------------------------------------------------------------------------

# openapi-generator (Apache-2.0), Maven Central org.openapitools:openapi-generator-cli, released 2026-08-24.
# 7.26.0 (2026-10-06) is newer but less than two weeks old today. Used for the Dart dart-dio client.
openapiGenerator.version=7.25.0
openapiGenerator.jarUrl=https://repo1.maven.org/maven2/org/openapitools/openapi-generator-cli/7.25.0/openapi-generator-cli-7.25.0.jar
openapiGenerator.sha256=41ce4f6b07f196676439d710759fa1ced7a08066d06ff1bf314681470289efae
# Docker fallback when no Java runtime is on the PATH (tag pushed 2026-08-24).
openapiGenerator.dockerImage=openapitools/openapi-generator-cli:v7.25.0

# openapi-typescript (MIT), npm, released 2026-02-11. Generates sdk/typescript/src/generated/schema.ts.
openapiTypescript.version=7.13.0
# openapi-fetch (MIT), npm, released 2026-02-11. Runtime client for the TypeScript SDK.
openapiFetch.version=0.17.0

# openapi-python-client (MIT), PyPI, released 2026-08-30; needs Python >= 3.11.
openapiPythonClient.version=0.29.1

# --- Dart runtime and build dependencies (pub.dev) --------------------------------------------------

dart.sdk=^3.8.0
dart.dio=5.11.1
dart.jsonAnnotation=4.12.0
dart.jsonSerializable=6.14.1
dart.copyWithExtension=18.0.0
dart.copyWithExtensionGen=18.0.0
# build_runner 2.16.2 was published 2026-10-07 (11 days ago); 2.16.1 (2026-09-02) is the floor.
dart.buildRunner=2.16.1
dart.test=1.32.0
dart.lints=6.1.0

# --- TypeScript runtime and dev dependencies (npm) --------------------------------------------------

# typescript 5.9.3: openapi-typescript 7.13.0 declares the peer typescript ^5.x.
ts.typescript=5.9.3
ts.vitest=5.0.3
ts.vite=8.3.1
ts.typesNode=24.19.0

# --- Python runtime and test dependencies (PyPI) ----------------------------------------------------

py.httpx=0.28.1
py.attrs=26.1.0
py.pytest=9.1.1
# Test dependency of scripts/sdk/tests/test_preprocess_dart_spec.py.
py.openapiSpecValidator=0.9.0
