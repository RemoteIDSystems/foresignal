# Elaro — broker plus PostGIS.
#
#   docker compose up -d        # database and broker
#   docker compose up -d db     # database only, for local development
#                               # (then run the app from your IDE or ./gradlew bootRun)
services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: elaro
      POSTGRES_USER: elaro
      POSTGRES_PASSWORD: elaro
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elaro -d elaro"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  elaro:
    build: .
    environment:
      ELARO_DB_URL: jdbc:postgresql://db:5432/elaro
      ELARO_DB_USER: elaro
      ELARO_DB_PASSWORD: elaro
      ELARO_DATA_DIR: /data
      ELARO_PORT: "8080"
      SPRING_PROFILES_ACTIVE: docker
    volumes:
      - elaro-data:/data
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  elaro-data:
