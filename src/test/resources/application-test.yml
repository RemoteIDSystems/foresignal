# Test profile. The datasource is supplied by the shared PostGIS container via
# @ServiceConnection, so no URL is set here.

spring:
  jpa:
    # 'update', not 'create-drop'. All integration tests share one container, and
    # Spring's test-context cache can hold several contexts against it at once;
    # when one context closed, create-drop would drop the schema - including the
    # GiST indexes created by SchemaBootstrap - out from under the contexts still
    # running. Tests get a clean slate from DatabaseCleaner truncating rows
    # instead, which leaves the schema and its indexes in place.
    hibernate:
      ddl-auto: update
    open-in-view: false

foresignal:
  # Kept off the real ./data directory so tests never touch developer state.
  data-dir: ${java.io.tmpdir}/foresignal-test-data
  reset-admin-token: false
  version: test
  # Several cached test contexts share one database, so none may hold the
  # writer's advisory lock, run scheduled partition maintenance or run
  # scheduled retention. Tests drive the PartitionManager directly.
  ingest:
    writer:
      exclusive: false
      # Short, so IngestWriterIT can provoke a lock timeout (55P03) and its retry quickly.
      lock-timeout: 500ms
  history:
    maintenance:
      enabled: false
  retention:
    scheduled: false
  # The watchdog does not tick in tests; WatchdogIT calls WatchdogService.tick().
  watchdog:
    scheduled: false
  # No context polls or streams on its own: an enabled fake source would otherwise
  # start fetching behind another test's back. CollectorSchedulerIT turns it on.
  collector:
    scheduled: false
  # The notification delivery worker does not poll in tests; they call DeliveryWorker.runOnce().
  notify:
    scheduled: false
  # The briefing scheduler does not tick in tests; BriefingSchedulerIT calls BriefingScheduler.tick().
  briefing:
    scheduled: false

logging:
  level:
    root: warn
    ai.foresignal: info
    org.testcontainers: warn
    com.github.dockerjava: warn
    org.hibernate.SQL: warn
