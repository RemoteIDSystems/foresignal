# Test profile. The datasource is supplied by the shared PostGIS container via
# @ServiceConnection, so no URL is set here.

spring:
  jpa:
    # Flyway builds the shared container's schema once (the first context migrates it, later contexts find it
    # current), and Hibernate validates it, as in production (prompt 144). Never create-drop: several cached
    # contexts share the container, and dropping the schema when one closed would pull it out from under the
    # others. Tests get a clean slate from DatabaseCleaner truncating rows, which leaves the schema, its indexes
    # and flyway_schema_history in place.
    hibernate:
      ddl-auto: validate
    open-in-view: false

foresignal:
  # Kept off the real ./data directory so tests never touch developer state.
  data-dir: ${java.io.tmpdir}/foresignal-test-data
  reset-admin-token: false
  version: test
  # Several cached test contexts share one database, so none may hold the
  # writer's advisory lock, run scheduled partition maintenance or run
  # scheduled retention. Tests drive the PartitionManager directly.
  ingest:
    writer:
      exclusive: false
      # Short, so IngestWriterIT can provoke a lock timeout (55P03) and its retry quickly.
      lock-timeout: 500ms
  history:
    maintenance:
      enabled: false
  retention:
    scheduled: false
  # The watchdog does not tick in tests; WatchdogIT calls WatchdogService.tick().
  watchdog:
    scheduled: false
  # No context polls or streams on its own: an enabled fake source would otherwise
  # start fetching behind another test's back. CollectorSchedulerIT turns it on.
  collector:
    scheduled: false
  # The notification delivery worker does not poll in tests; they call DeliveryWorker.runOnce().
  notify:
    scheduled: false
  # The MQTT summary and health refreshes do not run on their own; the 060 ITs call MqttStatePublisher
  # directly. A short keepalive lets the broker notice a cut connection (Last Will) within seconds.
  mqtt:
    scheduled: false
    keep-alive: 5s
    connect-timeout: 3s
  # The push dispatch worker and sweeper do not run in tests (they call PushDispatchWorker.runOnce() and
  # PushSubscriptionService.sweep()), and the built-in Push channel is not created on startup, so other
  # notification tests see only their own channels; the push ITs create it with PushBootstrap.
  push:
    scheduled: false
    builtin-channel: false
  # The action pollers (Telegram callbacks, Matrix reactions, Pushover receipts) and the escalation
  # worker do not run in tests; the ITs call pollOnce() and runOnce() (prompt 033).
  actions:
    scheduled: false
  # Interactive chat connectors do not start on their own in tests, and commands run on the polling thread, so a test
  # drives start() and poll() and sees the replies when poll() returns (prompt 061).
  chatops:
    scheduled: false
    async-commands: false
  escalation:
    scheduled: false
  # The activity rollup job does not run on its own in tests; RollupJobIT calls RollupJob.runOnce() (prompt 038).
  stats:
    scheduled: false
  # No reference data is downloaded in tests; the 040 ITs load small fixtures with ReferenceDataLoader.loadNow.
  reference:
    auto-load: false
  # The briefing scheduler does not tick in tests; BriefingSchedulerIT calls BriefingScheduler.tick().
  briefing:
    scheduled: false
  # The windowed-rule scheduler does not drive rule-windows in tests; the window ITs call WindowEngine.evaluate()
  # (prompt 100), so a background evaluation never races their explicit ones.
  windows:
    scheduled: false
  # Pattern of life and trips (prompt 114) do not tick on their own in tests; PolServiceIT drives PolEngine.tick and
  # TripCorridorIT drives TripWatch.tick.
  pol:
    scheduled: false
  trips:
    scheduled: false
  quality:
    scheduled: false
  # The evidence resolver does not run on its own in tests; the 116 ITs call EvidenceResolver.catchUp(), and the
  # weekly observability estimator does not tick (CaptureRecaptureTest and the ITs call it directly).
  evidence:
    auto-start: false
  observability:
    scheduled: false
  # The external binding router (138) does not run on its own in tests; BindingRouterIT calls BindingRouter.catchUp(),
  # and new bindings backfill inline.
  external:
    bindings:
      auto-start: false
  # The adapter doctor (140) does not run on its own in tests, so no health transition probes an upstream in the
  # background; DoctorAutoRunIT switches it on, synchronously, in its own context.
  doctor:
    auto-enabled: false
    auto-async: false
  # The CFTC COT backfill tick does not run on its own in tests; CotBackfillIT calls CotBackfillService.tick() (117).
  backfill:
    scheduled: false
  # The situation linker and scheduler do not run on their own in tests (118); the ITs call SituationLinker.catchUp(),
  # SituationSnapshots.snapshot(day), SituationService.sweep(...) and SituationBriefService.generate(...).
  situations:
    auto-start: false
    scheduled: false
  # The discovery schedule does not run in tests (119); the ITs call AnalysisSeriesRegistrar.run, ChangePointService,
  # LiveEventStudyService.poll/scanMoves and CoOccurrenceService.run.
  analytics:
    scheduled: false
  # The enrichment worker does not subscribe on its own in tests (EnrichmentWorkerIT starts it), and
  # the LLM timeout is short so EnrichmentWorkerIT can provoke a timeout quickly.
  enrichment:
    auto-start: false
    timeout: 2s
  # Per-client rate limits and the auth-failure backoff (prompt 035) are off, so the many requests and
  # deliberate bad credentials of other tests never meet a 429. ClientRateLimitFilterIT, RateLimitSettingsIT
  # and the backoff tests turn them on with @TestPropertySource.
  ratelimit:
    enabled: false
  # The infrastructure graph is not rebuilt on its own in tests (after imports or weekly); the 104 ITs
  # call InfraGraphBuilder.rebuild() or the rebuild endpoint.
  infra:
    auto-rebuild: false
    auth-backoff-enabled: false
  # Saved-search match notifications do not run on their own in tests; SavedSearchIT calls
  # SavedSearchService.notifyDue() (prompt 130).
  collab:
    saved-search-scheduled: false
  # Chronicle capture, its listeners and its own retention do not run on their own in tests (prompt 131); the ITs call
  # ChronicleCaptureService.catchUp(), ChronicleSignals.poll() and ChronicleRetentionJob.run(). Backfills, archives
  # and restores run on the request thread, so they are finished when the request returns.
  chronicles:
    auto-start: false
    retention-scheduled: false
    async-jobs: false
    network-scheduled: false
  # Social signals (prompt 135): nothing aggregates on its own and bluesky-jetstream is not switched on, so no test
  # connects to Jetstream; the ITs call SocialJobs.flush() and closeHour() and enable platforms explicitly.
  social:
    scheduled: false
    default-enable: false
    narratives-scheduled: false
    correlation-scheduled: false
    cues-async: false

logging:
  level:
    root: warn
    ai.foresignal: info
    org.testcontainers: warn
    com.github.dockerjava: warn
    org.hibernate.SQL: warn
