# Test broker of the prompt 060 integration tests (eclipse-mosquitto:2).
per_listener_settings true

# Anonymous plain listener: the default channel tests and the probes.
listener 1883
allow_anonymous true

# Password listener: user fs, password s3cret (created at container start).
listener 1884
allow_anonymous false
password_file /tmp/passwd

# TLS listener with the test CA's server certificate (CN and SAN localhost, IP 127.0.0.1).
listener 8883
allow_anonymous true
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
