# Foresignal bootstrap configuration.
#
# Only bootstrap concerns live here, all overridable by environment variables
# (Architecture §13). Sources, budgets, credentials, retention, triggers,
# webhooks and CORS are stored in the database and managed through the API.

spring:
  application:
    name: foresignal
  datasource:
    url: ${FORESIGNAL_DB_URL:jdbc:postgresql://localhost:5433/foresignal}
    username: ${FORESIGNAL_DB_USER:foresignal}
    password: ${FORESIGNAL_DB_PASSWORD:foresignal}
    hikari:
      data-source-properties:
        # Lets the ingest writer's JDBC batches become multi-row inserts. Also
        # applies to the Testcontainers @ServiceConnection URL.
        reWriteBatchedInserts: true
  jpa:
    # Hibernate owns the schema during development, except the partitioned
    # record_version, whose DDL HistorySchemaInitializer owns. Flyway is
    # introduced only in production hardening (prompt 144).
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 500
          time_zone: UTC
        order_inserts: true
        hbm2ddl:
          # Makes Hibernate see the partitioned record_version as an existing
          # table instead of trying to create it.
          extra_physical_table_types: PARTITIONED TABLE
  threads:
    virtual:
      enabled: true
  mvc:
    async:
      # SSE streams are long-lived; MVC must not time them out.
      request-timeout: -1
    problemdetails:
      # RFC 9457 error bodies (Architecture §10). GlobalExceptionHandler is what
      # actually shapes them: declaring a ResponseEntityExceptionHandler bean makes
      # Boot's own problem-details configuration back off.
      enabled: true

server:
  port: ${FORESIGNAL_PORT:8080}
  compression:
    # gzip for read responses (014). Never text/event-stream: compressing SSE
    # buffers events and breaks streaming.
    enabled: ${FORESIGNAL_COMPRESSION:true}
    mime-types:
      - application/json
      - application/geo+json
      - application/x-ndjson
      - application/geo+json-seq
      - application/problem+json
      - application/vnd.mapbox-vector-tile

foresignal:
  data-dir: ${FORESIGNAL_DATA_DIR:./data}
  # Root for INBOX_PATH source parameters. Every inbox read is confined to this
  # directory, re-checked per file, so a symlink cannot redirect a read out of it.
  inbox-dir: ${FORESIGNAL_INBOX_DIR:${FORESIGNAL_DATA_DIR:./data}/inbox}
  reset-admin-token: ${FORESIGNAL_RESET_ADMIN_TOKEN:false}
  version: ${spring.application.version:unknown}
  history:
    # Seq values per record_version leaf (Core-Data-Model §9).
    track-block: 20000000
    standard-block: 250000000
    maintenance:
      enabled: true
      interval: 10m
  ingest:
    # Commands that may wait for the single writer before producers back off.
    queue-capacity: 64
    writer:
      # Hold the single-writer advisory lock (invariant I1). Off in tests.
      exclusive: true
      # SET LOCAL lock_timeout for each batch transaction; a timeout is retried.
      lock-timeout: 10s
  api:
    # Read API (014).
    query:
      # SET LOCAL statement_timeout of every read query; longer runs are 503 QUERY_TIMEOUT.
      statement-timeout: 30s
    changes:
      # Kinds whose changes always carry their payload (Weather-Imagery-Design §6.8).
      inline-payload-kinds: raster-frame
    stream:
      # Most rows one ndjson/geojsonseq/csv response may hold (400 RESULT_TOO_LARGE above).
      max-rows: 500000
  collector:
    # Poll enabled sources and hold enabled streams open (Architecture §5.1).
    # Off in tests, where cached contexts share one database.
    scheduled: true
    reconcile-interval: 2s
    shutdown-wait: 30s
    stream:
      # PolicyAwareRecordSink (Core-Data-Model §7).
      flush-interval: 2s
      flush-max-entries: 2000
      all-buffer-max: 50000
      accept-block-timeout: 30s
      reconnect-ladder: 5s,15s,60s,300s,900s
      ladder-reset-after: 10m
      credentials-retry: 1h

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      # 'never', not 'when-authorized'. when-authorized is resolved by Spring
      # Security, which Foresignal deliberately does not use, so it would silently
      # behave as never anyway. /actuator/health is for container health checks;
      # detailed status belongs to GET /v1/system.
      show-details: never

springdoc:
  api-docs:
    # The springdoc-generated document is served separately; it is used for
    # drift detection against the authored contract (prompt 017).
    path: /v1/openapi-generated.json
  swagger-ui:
    path: /docs
    url: /v1/openapi.json

---
# Container runtime: structured JSON logs for log shipping. Local runs keep the
# default human-readable console output.
spring:
  config:
    activate:
      on-profile: docker

logging:
  structured:
    format:
      console: ecs
